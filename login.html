<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>판다마켓 - login</title>

    <script
      async
      src="https://www.googletagmanager.com/gtag/js?id=G-XE17PBY901"
    ></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      gtag("js", new Date());

      gtag("config", "G-XE17PBY901");
    </script>
    <link rel="stylesheet" href="/css/common/reset.css" />
    <link rel="stylesheet" href="/css/common/pattern.css" />
    <link rel="stylesheet" href="/css/custom/login.css" />
  </head>
  <body>
    <div class="content">
      <header class="login-header">
        <nav>
          <a href="/index.html"
            ><img src="/assets/imgs/logo/logo_lg.png" alt="판다마켓 로고"
          /></a>
        </nav>
      </header>
      <main class="login-wrap">
        <form class="login-form" action="submit" method="post">
          <div class="login-input">
            <label for="login-id">이메일</label>
            <input
              type="text"
              name="id"
              id="login-id"
              placeholder="이메일을 입력해주세요."
              required
            />
          </div>
          <div class="login-input">
            <label for="login-pw">비밀번호</label>
            <input
              type="password"
              name="pw"
              id="login-pw"
              placeholder="비밀번호를 입력해주세요."
              required
            />
            <button class="pw-visibility">
              <img
                src="/assets/imgs/icons/ic_visibility.svg"
                alt="비밀번호 가리기/보기"
              />
            </button>
          </div>
        </form>
        <button class="btn btn-login deactive">로그인</button>
        <section class="login-s-box">
          <p>간편 로그인하기</p>
          <div class="login-s-btns">
            <div id="login-google" class="login-s-btn">
              <img src="/assets/imgs/icons/ic_google.svg" alt="구글 로그인" />
              <a
                href="https://www.google.com/"
                target="_blank"
                rel="noopener noreferrer"
              ></a>
            </div>
            <div id="login-kakao" class="login-s-btn">
              <img
                src="/assets/imgs/icons/ic_kakaotalk.svg"
                alt="카카오 로그인"
              /><a
                href="https://www.kakaocorp.com/page/"
                target="_blank"
                rel="noopener noreferrer"
              ></a>
            </div>
          </div>
        </section>
        <section class="login-footer">
          <span>판다마켓이 처음이신가요?</span>
          <a class="login-link" href="/signup.html">회원가입</a>
        </section>
      </main>
    </div>
  </body>
</html>
